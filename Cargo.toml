[package]
name = "rust-p2w"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust reimplementation of the p2w Python-subset to WebAssembly (WAT) compiler"

[dependencies]
ryu = "1"
# Only for `p2w run` (the `run` feature). OFF BY DEFAULT so a plain build of the
# library and the compiler keeps exactly one runtime dependency, which is the
# crate's stated character. Executing a program is a different job from
# compiling one, and only the harness needs it.
wasmtime = { version = "44.0.2", default-features = false, features = [
    "cranelift",
    "gc",
    "gc-null",
    "runtime",
], optional = true }
wat = { version = "1", optional = true }

[features]
default = []
# `p2w run` — execute a program under a deterministic fuel budget.
run = ["dep:wasmtime", "dep:wat"]

[dev-dependencies]
wasmtime = { version = "44.0.2", default-features = false, features = ["cranelift", "gc", "gc-null", "runtime"] }
wat = "1"

# Tests JIT-compile every program through Cranelift; an unoptimized Cranelift
# is 10-50x slower, dominating the suite. Optimize dependencies (one-time
# rebuild) while keeping this crate's own incremental builds fast.
[profile.dev.package."*"]
opt-level = 2

# `p2w run` needs wasmtime, so it only exists with --features run.
[[bin]]
name = "p2w-run"
path = "src/bin/run.rs"
required-features = ["run"]
