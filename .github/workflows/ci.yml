name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Main crate. python3 is preinstalled on the runner, so the differential
      # tests compare against real CPython rather than skipping.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      # Native runtime crate (p2w-rt) — a separate crate, not a workspace member,
      # so it needs its own invocations.
      - run: cargo test --manifest-path runtime/Cargo.toml
      - run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check

  # The runtime is ~3k lines of unsafe offset arithmetic; Miri interprets the
  # whole test suite and rejects any undefined behavior (misalignment, OOB,
  # aliasing). ~8s of runtime — cheap insurance on the code both backends'
  # futures sit on.
  # Bounded proofs over the allocator (runtime/src/lib.rs cfg(kani) module):
  # alloc postconditions, disjointness, freelist reuse — hold for EVERY input
  # within bounds, not a sample. The proofs run against a 2KB arena model
  # (invariants are size-independent; 64K symbolic cells is hours of solver).
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install kani-verifier --locked
      - run: kani setup
      - run: cargo kani --manifest-path runtime/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --manifest-path runtime/Cargo.toml

  # The Mojo bridge (docs/MOJO_BRIDGE.md): programs `p2w check --profile mojo`
  # calls READY must compile and run under the REAL Mojo compiler with the
  # shipped prelude, printing exactly what CPython prints — this job turns the
  # doc's "believed valid Mojo" into "verified". Cases: tests/mojo_bridge/.
  #
  # DISABLED 2026-10-19: Mojo 1.1 now requires `var` for every new local
  # binding, annotated or not — and `var` is block-scoped where Python's
  # implicit assignment is function-scoped, so there's no safe mechanical fix
  # (injecting `var` at a name's first assignment changes behavior for any
  # name first assigned inside a branch and read afterward — ordinary code,
  # not an edge case). That breaks the bridge's actual claim: "this exact
  # Python text, unchanged, is also valid Mojo." See docs/MOJO_BRIDGE.md for
  # the full account; the Mojo side may relax this post-1.0 (Modular's own
  # forum thread left that open), so this is parked, not deleted.
  mojo-bridge:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tools/mojo/mojo_diff.sh
